hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Aviso no Telegram quando um modelo deixa de ser gratuito"
description = "Depois de gravar a proposta, o agente lê bot_token e chat_id da config (só leitura) e envia um Telegram com os modelos que passaram de gratuito a pago, apontando o arquivo da proposta; sem item de gratuidade perdida não envia nada."
verify = "Com uma proposta que traz um modelo passando de gratuito a pago chega uma mensagem no Telegram com o modelo e o caminho da proposta; uma rodada sem essa mudança não envia mensagem."
covers = ["R9"]
after = [5]
hitl = true
risk = "low"

