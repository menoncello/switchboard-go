# Épicos da iniciativa multi-provider, em ordem de construção.
# R15 (recarga por SIGHUP) fica fora: ticket avulso a criar em backlog/, decisão do Eduardo.

[[epic]]
id = 1
slug = "epic-pagina-de-status"
title = "O Eduardo vê o estado das chaves numa página"
description = "Uma página HTML renderizada no servidor mostra o estado, o cooldown e o uso de cada chave, sem expor API nova e sem abrir o /admin."
covers = ["R12"]

[[epic]]
id = 2
slug = "epic-roteamento-por-tiers"
title = "O proxy troca de provedor quando um falha"
description = "Com a cota do OpenCode Go esgotada, uma request do Hermes é atendida pelo próximo tier gratuito com modelo mapeado, sem mudar os agentes; config com tier pago é rejeitada até o teto existir. Entrega ao relatório e ao catálogo: o log por request, o cooldown persistido, a lista de tiers e o formato da config. Entrega à página: a seção de tiers."
covers = ["R1", "R2", "R3", "R4", "R6", "R7", "R8", "R10", "R11", "R12", "R16"]
after = [{ epic = 1, needs = "a página de status, que lê KeyManager.Status() (reescrito aqui) e recebe a seção de tiers" }]

[[epic]]
id = 3
slug = "epic-relatorio-de-uso-e-custo"
title = "O Eduardo sabe quanto cada projeto e modelo usou e custou"
description = "Um relatório agrega uso e custo por dia, projeto, modelo, chave e tier, e a página de status o mostra; o projeto vem do cabeçalho opcional X-Project. Estende o log do roteamento com projeto e tokens e é dono do histórico de uso, da tabela de preços e do teto diário em dinheiro dos tiers pagos, com o gasto do dia persistido e o alerta SMTP no primeiro uso."
covers = ["R5", "R10", "R13", "R14"]
after = [{ epic = 2, needs = "o log estruturado, o arquivo de estado persistido e a lista de tiers" }]

[[epic]]
id = 4
slug = "epic-catalogo-automatico"
title = "O Eduardo recebe propostas de modelos e limites novos"
description = "Uma automação recorrente pesquisa modelos novos, limites novos e quem deixou de ser gratuito, e grava propostas de mudança sem tocar no roteamento nem na config."
covers = ["R9"]
after = [{ epic = 2, needs = "o formato da config de tiers" }, { epic = 3, needs = "o formato da tabela de preços, que as propostas de limite e gratuidade citam" }]
