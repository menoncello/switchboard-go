# Stories do épico roteamento-por-tiers, em ordem de construção. Uma trilha só: tudo mexe em KeyManager e proxyV1.

[[entry]]
id = 1
type = "story"
title = "Separar main.go em arquivos do package main"
description = "Divide main.go em arquivos por responsabilidade (config, chaves, proxy, notificação SMTP, servidor) dentro do package main, sem pacotes novos, sem interfaces novas e sem mudar comportamento."
verify = "go build e go test passam sem alterar nenhum teste existente, e main.go fica só com main() e a montagem do servidor."
covers = []
after = []
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Failover do tier 0 para um tier extra com mapa de modelos"
description = "Tracer: lista tiers: na config (a config atual vira o tier 0 implícito) e, com todas as chaves do tier 0 esgotadas, a request segue ao tier 1, com o campo model reescrito pelo mapa do tier; o tier sem mapeamento para o modelo é pulado. Cada tier da lista traz name, base_url, api_key, free, estilos e o mapa de modelos, tudo na config YAML; um tier sem free: true é rejeitado na partida (o tier 0 implícito é isento); sem model no corpo (ex.: GET /models) a request fica no tier 0; /admin/* e /status seguem iguais. Documenta tiers: em docs/configuration.md."
verify = "go test com dois upstreams httptest: com o tier 0 devolvendo 429 de cota em todas as chaves, uma request com modelo mapeado é atendida pelo tier 1 com o modelo reescrito, e uma com modelo sem mapeamento volta o 429 local de todas esgotadas. Uma config sem tiers: se comporta como hoje, e /admin/keys, /admin/status e /status devolvem o mesmo de antes. Com dois upstreams locais e um curl, a request volta do tier 1 com o modelo reescrito."
covers = ["R1", "R2", "R4", "R6"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Log estruturado por request"
description = "Cada request grava uma linha de log JSON com modelo, estilo de API, chave ou tier, status e latência; o 429 local e o 502 sem tier são gravados com tier vazio; nenhuma linha traz o valor de uma chave."
verify = "go test cobre uma request atendida pelo tier 0 e outra pelo tier 1 e confere os cinco campos (modelo, estilo, chave ou tier, status e latência) na linha de log e a ausência do valor das chaves."
covers = ["R11"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Failover por falha do upstream, com cooldown por tier"
description = "401, 402, 404, 5xx, 429 e erro de conexão ou timeout antes do primeiro byte colocam o tier em cooldown (campo cooldown por tier, padrão retry_exhausted_after) e a request segue ao próximo tier; 400 volta ao cliente; depois do primeiro byte não há failover. No tier 0, só 429 de cota e 403 de assinatura giram a chave; os demais põem o tier inteiro em cooldown. Documenta cooldown em docs/configuration.md."
verify = "go test cobre cada status e o erro de conexão com um upstream que falha e outro que atende, 400 voltando ao cliente sem cooldown, um stream já iniciado que não troca de tier."
covers = ["R7"]
after = [2, 3]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Estilos de API por tier"
description = "Cada tier declara os estilos que fala (OpenAI, Anthropic); o tier é pulado se não fala o do request, e a autenticação segue o estilo do tier (x-api-key para Anthropic, Bearer para OpenAI). Documenta os estilos em docs/configuration.md."
verify = "go test: uma request Anthropic com o tier 0 esgotado pula um tier que só fala OpenAI e é atendida por um que fala Anthropic, com x-api-key; sem nenhum tier compatível, volta o 429 local no formato Anthropic."
covers = ["R3"]
after = [4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Elegibilidade por contexto mínimo e tool calling"
description = "Cada entrada do mapa de modelos declara contexto e suporte a tool calling; a config tem min_context global (padrão 64000, o mínimo do Hermes) e a checagem de tool calling só vale para request com tools; um modelo sem context declarado ou abaixo do mínimo não é elegível naquele tier; o tier 0 é isento. Documenta min_context, context e tools em docs/configuration.md."
verify = "go test: um modelo mapeado com contexto abaixo do mínimo faz o tier ser pulado; uma request com tools é pulada num modelo sem tool calling, e uma sem tools é atendida por ele; um modelo que atinge o mínimo é atendido."
covers = ["R8"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Persistir o cooldown dos tiers"
description = "O cooldown de cada tier e de cada chave do tier 0 é gravado em JSON local com escrita atômica, no caminho de state_file na config, e carregado na partida; as chaves entram por um prefixo do SHA-256, nunca pelo valor nem só pelo índice; um cooldown vencido não é restaurado. Documenta state_file em docs/configuration.md e o volume do Docker para o arquivo em docs/docker.md."
verify = "go test: um tier em cooldown continua em cooldown depois de recriar o app a partir do arquivo, um vencido volta elegível, e uma falha de escrita não derruba a request. Com o proxy rodando, reiniciar mantém em /status o cooldown das chaves do tier 0."
covers = ["R10"]
after = [6]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Seção de tiers na página /status"
description = "A página /status mostra cada tier com estado e cooldown, sem o valor de nenhuma chave; o uso do dia entra com o épico de relatório."
verify = "go test: /status sem PROXY_API_KEY na request devolve a seção de tiers com um tier em cooldown e o tempo restante, e o corpo não contém o valor de nenhuma chave nem de tier. Com o proxy rodando, a seção aparece abaixo das chaves."
covers = ["R12"]
after = [7, "1.1"]
hitl = false
risk = "low"

